services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "5001"
      MONGO_URI: "${MONGO_URI:-mongodb://mongodb:27017/gateway_project}"
      JWT_SECRET: "${JWT_SECRET:-mysecretkey}"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-gateway-internal-secret-key}"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "const key = process.env.INTERNAL_API_KEY || 'gateway-internal-secret-key'; fetch('http://localhost:5001/users/profile', { headers: { 'x-internal-key': key } }).then(r => r.status === 200 ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "5000"
      USER_SERVICE_URL: "${USER_SERVICE_URL:-http://user-service:5001}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      JWT_SECRET: "${JWT_SECRET:-mysecretkey}"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-gateway-internal-secret-key}"
      RATE_LIMIT_MAX: "${RATE_LIMIT_MAX:-100}"
      RATE_LIMIT_WINDOW: "${RATE_LIMIT_WINDOW:-60}"
      AUTH_RATE_LIMIT_MAX: "${AUTH_RATE_LIMIT_MAX:-5}"
      AUTH_RATE_LIMIT_WINDOW: "${AUTH_RATE_LIMIT_WINDOW:-60}"
      RATE_LIMIT_FAIL_OPEN: "${RATE_LIMIT_FAIL_OPEN:-true}"
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      PROXY_TIMEOUT_MS: "${PROXY_TIMEOUT_MS:-5000}"
    ports:
      - "${GATEWAY_PORT:-5000}:5000"
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:5000/health').then(r => r.status === 200 ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app_network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
